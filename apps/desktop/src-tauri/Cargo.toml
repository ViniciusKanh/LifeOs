[package]
name = "lifeos-desktop"
version = "0.1.0"
description = "LifeOS Desktop — Transforme sua rotina em progresso."
authors = ["Vinicius Santos"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# Nome distinto do binário (requisito do Tauri 2 no Windows).
name = "lifeos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

# Cofre de credenciais do sistema: Gerenciador de Credenciais no Windows.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
